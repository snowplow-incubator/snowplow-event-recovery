name: Lint & Test

on:
  push:
    branches: develop
  pull_request:

jobs:
  test:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Label PR
        if: github.event_name == 'pull_request'
        uses: TimonVS/pr-labeler-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          # Coursier, Ivy and sbt caches, keyed on the build definition
          cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - name: Install Thrift
        # core generates CollectorPayload with the thrift compiler
        run: sudo apt-get update && sudo apt-get install -y thrift-compiler
      - name: Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "[REBASE] Run formatter/linter"
      - name: Test
        # The integration tests start LocalStack with Docker, which the runner provides
        run: sbt test flink/IntegrationTest/test

  # Runs the released jar with `flink run` on Flink 1.20 and Java 11. The tests above run on sbt's classpath with a
  # newer Scala than the one Flink ships, so they cannot catch a jar that fails on the cluster.
  flink-jar:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - name: Install Thrift
        # core generates CollectorPayload with the thrift compiler
        run: sudo apt-get update && sudo apt-get install -y thrift-compiler
      - name: Build the Flink jar
        run: sbt flink/assembly
      - name: Run it on Flink
        run: flink/src/smoke/run.sh flink/target/scala-2.12/snowplow-event-recovery-flink-*.jar

  # Starts the Beam Docker image on its own JVM and validates a configuration, fetching its schema from Iglu Central
  beam-image:
    if: "!contains(github.event.head_commit.message, 'skip ci')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: sbt
      - name: Setup sbt
        uses: sbt/setup-sbt@v1
      - name: Install Thrift
        # core generates CollectorPayload with the thrift compiler
        run: sudo apt-get update && sudo apt-get install -y thrift-compiler
      - name: Build the Beam image
        run: sbt beam/docker:publishLocal
      - name: Run it
        run: beam/src/smoke/run.sh "$(docker images --format '{{.Repository}}:{{.Tag}}' snowplow/snowplow-event-recovery-beam | head -1)"
